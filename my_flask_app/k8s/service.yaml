apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: default  # Ou o namespace que você estiver usando
  labels:
    app: flask-app  # Certifique-se de que isso corresponda ao ServiceMonitor
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: flask-app  # Label do Pod da sua aplicação